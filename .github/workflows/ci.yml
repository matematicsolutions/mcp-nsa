name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: Drift test
        run: npm run drift

      - name: Offline fixture tests
        run: npm run test:parse

      - name: Conformance - argument validation
        run: npm run test:conformance

      - name: Verify dist artifact
        run: ls -la dist/index.js

      - name: Descriptor lock (tools/list vs test/tools.lock.json)
        run: npm run test:descriptors

      - name: E2E over MCP against a local CBOSA stub (provenance, error codes)
        run: npm run test:e2e

      - name: Package gate (runtime files in npm pack)
        run: npm run test:package
